<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Cobra</title>
    <meta name="description" content="Fale com o estúdio Cobra sobre o seu próximo projeto." />
  </head>
  <body>
    <nav data-nav-wrap data-nav-theme="light" class="nav">
      <div class="nav-inner">
        <a href="/" class="nav-brand-link" title="Cobra Home">
          <div class="nav-brand">COBRA</div>
        </a>
        <div class="btn-layout is-nav">
          <button data-nav-ham class="nav-ham" title="Abrir / Fechar menu" aria-expanded="false">
            <span class="screen-reader">Menu</span>
          </button>
        </div>
      </div>
    </nav>

    <div data-nav-m class="nav-menu-w">
      <div class="nav-menu-bg"></div>
      <div class="nav-menu-inner c">
        <div class="nav-menu-links-list">
          <a href="/" class="nav-menu-link-w">
            <div split-text="chars" class="text-nav-link">Home</div>
          </a>
          <a href="/work" class="nav-menu-link-w">
            <div split-text="chars" class="text-nav-link">Work</div>
          </a>
          <a href="/studio" class="nav-menu-link-w">
            <div split-text="chars" class="text-nav-link">Studio</div>
          </a>
          <a href="/contact" class="nav-menu-link-w">
            <div split-text="chars" class="text-nav-link">Contact</div>
          </a>
        </div>
        <div class="nav-menu-social-w">
          <a href="mailto:hello@cobra.art.br" class="text-link-w">
            <div class="text-clip-w"><div split-text="chars" class="btn-text">hello@cobra.art.br</div></div>
          </a>
        </div>
      </div>
    </div>

    <main id="app">
      <section data-nav-theme-target="light" class="s" style="min-height: 90vh; display: flex; align-items: center; padding-top: 6rem;">
        <div class="c">
          <span style="display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-grey-2); margin-bottom: 1.5rem;">
            Vamos conversar
          </span>
          <a href="mailto:hello@cobra.art.br" class="text-link-w">
            <div class="text-clip-w">
              <div
                split-text="lines"
                style="font-size: clamp(2.5rem, 8vw, 6.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1;"
              >
                hello@cobra.art.br
              </div>
            </div>
          </a>
          <div class="footer-grid" style="border-top: none; padding-top: 4rem;">
            <div class="footer-col">
              <span class="footer-col-title">Social</span>
              <a href="#" class="footer-link">Instagram</a>
              <a href="#" class="footer-link">Behance</a>
              <a href="#" class="footer-link">LinkedIn</a>
            </div>
            <div class="footer-col">
              <span class="footer-col-title">Estúdio</span>
              <span class="footer-link">São Paulo, Brasil</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer data-nav-theme-target="light" class="s footer" style="padding-top: 0;">
      <div class="c">
        <div class="footer-bottom" style="padding-top: 0; border-top: 1px solid var(--color-ink-tint-2);">
          <span>© 2026 Cobra. Todos os direitos reservados.</span>
          <span>Feito com Cobra</span>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
